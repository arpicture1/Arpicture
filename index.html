<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR PICTURE | Official</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Outfit', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #08090c;
      color: #ffffff;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 400px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    /* Marvel Style Solid Heading */
    h1 {
      font-family: 'Bebas Neue', Impact, sans-serif;
      font-size: 54px;
      letter-spacing: 3px;
      color: #ffffff;
      line-height: 1;
    }

    .tagline {
      color: #8c92a4;
      font-size: 13px;
      letter-spacing: 2px;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    /* Cards */
    .card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      cursor: pointer;
    }

    .card-clickable {
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    .card-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #ffffff;
    }

    .card-desc {
      font-size: 12px;
      color: #8c92a4;
      margin-top: 4px;
    }

    /* AI Gallery Drawer */
    .gallery-box {
      display: none;
      background: #11141c;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 15px;
      text-align: left;
    }

    .search-input {
      width: 100%;
      background: #1a1e29;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 10px 14px;
      border-radius: 8px;
      color: #ffffff;
      font-size: 13px;
      outline: none;
      margin-bottom: 12px;
    }

    .search-input:focus {
      border-color: #ff3b3b;
    }

    .ai-item-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .photo-preview {
      width: 100%;
      height: 180px;
      background: #1c202b;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #8c92a4;
      font-size: 13px;
    }

    .photo-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .prompt-box {
      padding: 10px;
    }

    .prompt-text {
      background: rgba(0, 0, 0, 0.4);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 12px;
      color: #d1d5db;
      line-height: 1.4;
      margin-bottom: 8px;
    }

    .copy-btn {
      width: 100%;
      background: #2b3040;
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 8px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
    }

    .no-results {
      text-align: center;
      color: #8c92a4;
      font-size: 13px;
      padding: 15px 0;
      display: none;
    }

    /* Buttons & Badges */
    .btn {
      display: block;
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      text-decoration: none;
      color: white;
      text-align: center;
    }

    .btn-wa { background: #25d366; }
    .btn-ig { background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045); }
    .contact-no { font-size: 13px; color: #8c92a4; }
    .divider { width: 60%; height: 1px; background: rgba(255, 255, 255, 0.15); margin: 10px auto 5px; }
    .coming-soon-title { font-size: 14px; font-weight: 700; letter-spacing: 2px; color: #ffffff; text-transform: uppercase; }
    .coming-soon-desc { font-size: 11px; color: #6d7385; margin-top: -8px; }
    .badges-row { display: flex; justify-content: center; gap: 15px; margin-top: 5px; }
    .badge-circle { width: 50px; height: 50px; border-radius: 50%; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.12); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: #a0a6b5; }
    .badge-circle span { font-size: 8px; font-weight: 400; color: #606778; }
  </style>
</head>
<body>

  <div class="container">
    
    <div>
      <h1>AR PICTURE</h1>
      <p class="tagline">CREATOR • BLOGGER</p>
    </div>

    <div class="card">
      <div class="card-title">PHOTO EDITING</div>
      <div class="card-desc">Editing • Retouching • Grading</div>
    </div>

    <div class="card card-clickable" onclick="toggleGallery()">
      <div class="card-title">AI PHOTO & PROMPTS ▾</div>
      <div class="card-desc">AI Images • Search Prompts (Tap to Open)</div>
    </div>

    <div class="gallery-box" id="myGallery">
      <input 
        type="text" 
        id="searchInput" 
        class="search-input" 
        placeholder="🔍 Search prompt (e.g. portrait, city)..." 
        onkeyup="filterCards()"
      />
      <div id="cardsList"></div>
      <div id="noResultsText" class="no-results">Koi matching prompt nahi mila 😕</div>
    </div>

    <a href="https://wa.me/9106045564" target="_blank" class="btn btn-wa">💬 WhatsApp</a>
    <a href="https://instagram.com/im_aarjun_v12" target="_blank" class="btn btn-ig">📸 Instagram</a>

    <div class="contact-no">📱 Contact: +91 9106045564 </div>

    <div class="divider"></div>

    <div class="coming-soon-title">COMING SOON</div>
    <div class="coming-soon-desc">More features coming...</div>

    <div class="badges-row">
      <div class="badge-circle">BG<span>Blogging</span></div>
      <div class="badge-circle">VE<span>Editing</span></div>
      <div class="badge-circle">CC<span>Creation</span></div>
    </div>

  </div>

  <script>
      const myAIPrompts = [
    {
      title: "Photo 1 - Golden Hour Sunset",
      image: "sunset-portrait.jpg",
      prompt: "Create an ultra-realistic cinematic portrait of a young South Asian man in a serene side profile pose with eyes gently closed. Golden hour sunset background with warm orange gradient lighting. Messy textured fade haircut blowing slightly in the gentle breeze, short trimmed beard and mustache. Wearing a casual black t-shirt with neckband earphones. Hyper-detailed skin texture, soft rim lighting outlining the facial contours, 8k resolution, shot on 85mm portrait lens, photorealistic, dramatic atmosphere."
    },
        {
      title: "Photo 2 - Shattered Glass Portal",
      image: "glass-shards.png",
      prompt: "Ultra-realistic cinematic medium shot of a young South Asian man surrounded by levitating shattered glass crystal shards. Bright clear blue sky background with direct sun flare creating glowing refraction highlights through transparent glass pieces. Textured wet crop fade hairstyle, clean trimmed beard, wearing a simple solid lavender-grey crewneck athletic t-shirt. Low-angle shot, sharp depth of field, 8k resolution, commercial photoshoot style, hyper-detailed."
    },

    {
      title: "Photo 3 - City Night Lights",
      image: "photo2.jpg",
      prompt: "Ultra-realistic cinematic 8k portrait standing in Gujarat city lights, neon reflections, sharp focus, Unreal Engine 5 render style."
    }
  ];


    const cardsList = document.getElementById('cardsList');

    function renderCards(data) {
      cardsList.innerHTML = '';
      data.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'ai-item-card';
        card.innerHTML = `
          <div class="photo-preview">
            <img src="${item.image}" alt="${item.title}" onerror="this.parentElement.innerHTML='🖼️ [ ${item.title} Preview ]'">
          </div>
          <div class="prompt-box">
            <div class="prompt-text">${item.prompt}</div>
            <button class="copy-btn" onclick="copyPrompt('${item.prompt.replace(/'/g, "\\'")}', this)">📋 Copy Prompt</button>
          </div>
        `;
        cardsList.appendChild(card);
      });
    }

    renderCards(myAIPrompts);

    function filterCards() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = myAIPrompts.filter(item => 
        item.prompt.toLowerCase().includes(query) || 
        item.title.toLowerCase().includes(query)
      );
      renderCards(filtered);
      document.getElementById('noResultsText').style.display = filtered.length === 0 ? 'block' : 'none';
    }

    function toggleGallery() {
      const box = document.getElementById('myGallery');
      box.style.display = (box.style.display === 'block') ? 'none' : 'block';
    }

    function copyPrompt(text, btn) {
      navigator.clipboard.writeText(text).then(() => {
        btn.innerText = '✅ Copied!';
        btn.style.background = '#25d366';
        setTimeout(() => {
          btn.innerText = '📋 Copy Prompt';
          btn.style.background = '#2b3040';
        }, 2000);
      });
    }
  </script>
</body>
</html>

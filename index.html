  <style>
        /* Category Filter Chips Styling */
    .filter-container {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 8px 0 16px 0;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .filter-container::-webkit-scrollbar {
      display: none;
    }
    .filter-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #94a3b8;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'Outfit', sans-serif;
    }
    .filter-btn.active {
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      color: #000000;
      border-color: transparent;
      box-shadow: 0 0 12px rgba(0, 242, 254, 0.4);
    }

    * {

      padding: 0;
      box-sizing: border-box;
      font-family: 'Outfit', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #08090c;

      display: flex;
      justify-content: center;

    }

    .container {
      width: 100%;

      text-align: center;
      display: flex;

      gap: 15px;
    }

    /* Marvel Style Solid Heading */
    h1 {
      font-family: 'Bebas Neue', Impact, sans-serif;

    }

    .tagline {
      color: #8c92a4;

    }

    /* Cards */
    .card {
      background: rgba(255, 255, 255, 0.04);

      padding: 16px;
      text-align: center;
      cursor: pointer;
    }

    .card-clickable {

    }

    .card-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #ffffff;
    }

    .card-desc {

      color: #8c92a4;
      margin-top: 4px;
    }

    /* AI Gallery Drawer */
    .gallery-box {
      display: none;
      background: #11141c;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 15px;
      text-align: left;
    }

    .search-input {
      width: 100%;
      background: #1a1e29;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 10px 14px;
      border-radius: 8px;
      color: #ffffff;
      font-size: 13px;
      outline: none;
      margin-bottom: 12px;
    }

    .search-input:focus {
      border-color: #ff3b3b;
    }

    .ai-item-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .photo-preview {
      width: 100%;
      height: 180px;
      background: #1c202b;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #8c92a4;
      font-size: 13px;
    }

    .photo-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .prompt-box {
      padding: 10px;
    }

    .prompt-text {
      background: rgba(0, 0, 0, 0.4);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 12px;
      color: #d1d5db;
      line-height: 1.4;
      margin-bottom: 8px;
    }

    .copy-btn {
      width: 100%;
      background: #2b3040;
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 8px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
    }

    .no-results {
      text-align: center;
      color: #8c92a4;
      font-size: 13px;
      padding: 15px 0;
      display: none;
    }

    /* Buttons & Badges */
    .btn {
      display: block;
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      text-decoration: none;
      color: white;
      text-align: center;
    }

    .btn-wa { background: #25d366; }
    .btn-ig { background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045); }
    .contact-no { font-size: 13px; color: #8c92a4; }
    .divider { width: 60%; height: 1px; background: rgba(255, 255, 255, 0.15); margin: 10px auto 5px; }
    .coming-soon-title { font-size: 14px; font-weight: 700; letter-spacing: 2px; color: #ffffff; text-transform: uppercase; }
    .coming-soon-desc { font-size: 11px; color: #6d7385; margin-top: -8px; }
    .badges-row { display: flex; justify-content: center; gap: 15px; margin-top: 5px; }
    .badge-circle { width: 50px; height: 50px; border-radius: 50%; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.12); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: #a0a6b5; }
    .badge-circle span { font-size: 8px; font-weight: 400; color: #606778; }
  </style>

<body>

  <div class="container">
    
    <div>
      <h1>AR PICTURE</h1>
      <p class="tagline">CREATOR • BLOGGER</p>
    </div>

    <div class="card">
      <div class="card-title">PHOTO EDITING</div>
      <div class="card-desc">Editing • Retouching • Grading</div>
    </div>

    <div class="card card-clickable" onclick="toggleGallery()">
      <div class="card-title">AI PHOTO & PROMPTS ▾</div>
      <div class="card-desc">AI Images • Search Prompts (Tap to Open)</div>
    </div>

    <div class="gallery-box" id="myGallery">
      <input 
        type="text" 
        id="searchInput" 
        class="search-input" 
        placeholder="🔍 Search prompt (e.g. portrait, city)..." 
        onkeyup="filterCards()"
      />
            <div class="filter-container">
        <button class="filter-btn active" onclick="filterCategory('all', this)">All</button>
        <button class="filter-btn" onclick="filterCategory('portrait', this)">Portraits</button>
        <button class="filter-btn" onclick="filterCategory('dark', this)">Dark Aesthetic</button>
        <button class="filter-btn" onclick="filterCategory('creative', this)">Creative FX</button>
      </div>

      <div id="cardsList"></div>
      <div id="noResultsText" class="no-results">Koi matching prompt nahi mila 😕</div>
    </div>

    <a href="https://wa.me/+91 9106045564" target="_blank" class="btn btn-wa">💬 WhatsApp</a>
    <a href="https://instagram.com/im_aarjun_v12" target="_blank" class="btn btn-ig">📸 Instagram</a>

    <div class="contact-no">📱 Contact: +91 9106045564 </div>

    <div class="divider"></div>

    <div class="coming-soon-title">COMING SOON</div>
    <div class="coming-soon-desc">More features coming...</div>

    <div class="badges-row">
      <div class="badge-circle">BG<span>Blogging</span></div>
      <div class="badge-circle">VE<span>Editing</span></div>
      <div class="badge-circle">CC<span>Creation</span></div>
    </div>

  </div>

  <script>
          const myAIPrompts = [
      {
        title: "Photo 1 - Golden Hour Sunset",
        image: "sunset-portrait.jpg",
        prompt: "Ultra-realistic cinematic side-profile portrait of a young South Asian man during golden hour. Natural textured skin with fine pores, modern textured crop fade hairstyle, subtle beard, wearing a casual black t-shirt with a neck strap. Warm golden sunlight illuminating the edge of his face (rim lighting), dreamy soft-focus blurred outdoor background with gentle bokeh, captured on 85mm lens, f/1.4 aperture, hyper-detailed, photorealistic, 8k resolution, cinematic color grading --ar 9:16 --v 6.0",
        category: "portrait"
      },
      {
        title: "Photo 2 - Shattered Glass Portal",
        image: "glass-shards.png",
        prompt: "A high-concept surreal portrait of a man looking intensely at the camera, shot through a fractured, shattered crystal-clear glass mirror. Sharp reflections, floating sharp glass shards with optical dispersion and chromatic aberration, dramatic moody studio chiaroscuro lighting, deep shadows, ultra-sharp facial features, cinematic atmosphere, Hasselblad H6D-100c, 100mm macro lens, 8k, photorealistic masterpiece --ar 9:16 --v 6.0",
        category: "creative"
      },
      {
        title: "Photo 3 - Dual Tone Smoke Portrait",
        image: "dark-portrait.png",
        prompt: "An ultra-realistic dramatic studio portrait of a man emerging from thick dense atmospheric smoke and haze. Dual-tone neon cinematic lighting with strong cyan and magenta edge glow, deep velvet black shadows, striking eye contact, wet texture reflections, detailed hair and skin realism, shot on Sony A7R V with 50mm f/1.2 lens, cinematic aesthetic, highly detailed, 8k --ar 9:16 --v 6.0",
        category: "dark"
      }
    ];

  ];


    const cardsList = document.getElementById('cardsList');

    function renderCards(data) {
      cardsList.innerHTML = '';
      data.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'ai-item-card';
        card.innerHTML = `
          <div class="photo-preview">
            <img src="${item.image}" alt="${item.title}" onerror="this.parentElement.innerHTML='🖼️ [ ${item.title} Preview ]'">
          </div>
          <div class="prompt-box">
            <div class="prompt-text">${item.prompt}</div>
            <button class="copy-btn" onclick="copyPrompt('${item.prompt.replace(/'/g, "\\'")}', this)">📋 Copy Prompt</button>
          </div>
        `;
        cardsList.appendChild(card);
      });
    }

    renderCards(myAIPrompts);

    function filterCards() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = myAIPrompts.filter(item => 
        item.prompt.toLowerCase().includes(query) || 
        item.title.toLowerCase().includes(query)
      );
      renderCards(filtered);
      document.getElementById('noResultsText').style.display = filtered.length === 0 ? 'block' : 'none';
    }

    function toggleGallery() {
      const box = document.getElementById('myGallery');
      box.style.display = (box.style.display === 'block') ? 'none' : 'block';
    }

    function copyPrompt(text, btn) {
      navigator.clipboard.writeText(text).then(() => {
        btn.innerText = '✅ Copied!';
        btn.style.background = '#25d366';
        setTimeout(() => {
          btn.innerText = '📋 Copy Prompt';
          btn.style.background = '#2b3040';
        }, 2000);
      });
    }
        function filterCategory(category, btnElement) {
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');

      if (category === 'all') {
        renderCards(myAIPrompts);
      } else {
        const filtered = myAIPrompts.filter(item => item.category === category);
        renderCards(filtered);
      }
    }

  </script>
</body>
